<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroCalc Pro</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f7f4;
}

header{
    background:linear-gradient(135deg,#1b5e20,#4caf50);
    color:white;
    text-align:center;
    padding:25px;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.container{
    max-width:900px;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 20px rgba(0,0,0,.1);
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

label{
    font-weight:600;
    color:#333;
}

input, select{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2e7d32;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1b5e20;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    margin-top:30px;
}

.card{
    background:#f8f8f8;
    padding:20px;
    border-radius:12px;
    text-align:center;
    border-left:5px solid #2e7d32;
}

.card h3{
    color:#555;
    font-size:15px;
}

.card p{
    margin-top:10px;
    font-size:22px;
    font-weight:bold;
    color:#1b5e20;
}

.barra{
    width:100%;
    background:#ddd;
    border-radius:20px;
    margin-top:25px;
    overflow:hidden;
}

.progresso{
    height:25px;
    width:0%;
    background:linear-gradient(90deg,#43a047,#81c784);
    text-align:center;
    color:white;
    line-height:25px;
    transition:1s;
}

footer{
    text-align:center;
    margin:20px;
    color:#666;
}

@media(max-width:700px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>🌾 AgroCalc Pro</h1>
    <p>Calculadora Inteligente de Safras</p>
</header>

<div class="container">

<div class="grid">

<div>
<label>Cultura</label>
<select id="cultura">
<option>Soja</option>
<option>Milho</option>
<option>Trigo</option>
<option>Café</option>
</select>
</div>

<div>
<label>Área Plantada (ha)</label>
<input type="number" id="area">
</div>

<div>
<label>Produtividade (sacas/ha)</label>
<input type="number" id="produtividade">
</div>

<div>
<label>Preço da Saca (R$)</label>
<input type="number" id="preco">
</div>

<div>
<label>Custo por Hectare (R$)</label>
<input type="number" id="custo">
</div>

</div>

<button onclick="calcularSafra()">
Calcular Resultados
</button>

<div class="cards">

<div class="card">
<h3>Produção Total</h3>
<p id="producao">0</p>
</div>

<div class="card">
<h3>Receita Bruta</h3>
<p id="receita">R$ 0</p>
</div>

<div class="card">
<h3>Custo Total</h3>
<p id="custototal">R$ 0</p>
</div>

<div class="card">
<h3>Lucro Líquido</h3>
<p id="lucro">R$ 0</p>
</div>

</div>

<h3 style="margin-top:25px;">Rentabilidade</h3>

<div class="barra">
<div class="progresso" id="rentabilidade">
0%
</div>
</div>

</div>

<footer>
AgroCalc Pro © 2026
</footer>

<script>

function calcularSafra(){

let area = Number(document.getElementById("area").value);
let produtividade = Number(document.getElementById("produtividade").value);
let preco = Number(document.getElementById("preco").value);
let custo = Number(document.getElementById("custo").value);

if(area <=0 || produtividade <=0 || preco <=0 || custo <0){
    alert("Preencha os dados corretamente.");
    return;
}

let producao = area * produtividade;
let receita = producao * preco;
let custoTotal = area * custo;
let lucro = receita - custoTotal;

let rentabilidade = (lucro / receita) * 100;

document.getElementById("producao").innerHTML =
producao.toLocaleString('pt-BR') + " sacas";

document.getElementById("receita").innerHTML =
"R$ " + receita.toLocaleString('pt-BR');

document.getElementById("custototal").innerHTML =
"R$ " + custoTotal.toLocaleString('pt-BR');

document.getElementById("lucro").innerHTML =
"R$ " + lucro.toLocaleString('pt-BR');

document.getElementById("rentabilidade").style.width =
Math.min(rentabilidade,100) + "%";

document.getElementById("rentabilidade").innerHTML =
rentabilidade.toFixed(1) + "%";

}

</script>

</body>
</html>
